<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co;">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="color-scheme" content="light dark">
  <title>Portfolio dashboard — Ogbanje Abraham</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/assets/css/auth.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <main class="section auth-page" id="main">
    <div class="container narrow">
      <section class="auth-card" aria-labelledby="admin-title">
        <a class="auth-brand" href="/">Ogbanje Abraham</a>
        <p class="eyebrow">Portfolio administration</p>
        <h1 class="section-title" id="admin-title">Dashboard</h1>
        <p class="auth-intro" id="admin-status" role="status" aria-live="polite">Checking your administrator access…</p>
        <div class="auth-actions" id="admin-actions" hidden>
          <button class="btn btn-ghost" id="sign-out-button" type="button">Sign out</button>
          <a class="btn btn-primary" href="/">View public portfolio</a>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.0" crossorigin="anonymous"></script>
  <script src="/assets/js/supabase-config.js"></script>
  <script src="/assets/js/auth-client.js"></script>
  <script src="/script.js"></script>
  <script src="/admin/admin.js"></script>
</body>
</html>
